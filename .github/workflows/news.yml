# Collects market headlines every morning on GitHub's servers, saves them to
# data/news/headlines.csv, and publishes outputs/news.html as the repo's web page.
name: Daily market news

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC = 6:00 New York in winter, 7:00 in summer
  workflow_dispatch:         # "Run workflow" button in the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect headlines
        run: python news.py      # standard library only, nothing to install
      - name: Save headlines to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news/headlines.csv outputs/news.html
          git diff --cached --quiet || git commit -m "News: $(date +'%Y-%m-%d')"
          git push
      - name: Prepare web page
        run: mkdir -p site && cp outputs/news.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
