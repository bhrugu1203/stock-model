# Keeps the website current on GitHub's servers.
#   Every morning, before the US market opens: collect headlines, download the latest closing
#   prices, retrain the model on everything up to yesterday, remake the picks, publish the site.
#   Every weekday after the market closes: the same again, so picks use that day's closing prices the same evening.
#   Every hour after that until evening: collect headlines and republish (picks stay the same).
name: Daily update

on:
  schedule:
    - cron: "0 11 * * *"           # 11:00 UTC = 6:00 New York in winter, 7:00 in summer: news + picks
    - cron: "30 21 * * 1-5"        # 21:30 UTC = 4:30 PM New York in winter, 5:30 PM in summer (always after the close): news + picks
    - cron: "0 12-23,0-1 * * *"    # hourly 12:00-01:00 UTC (about 7 AM to 8 PM New York): news only
  workflow_dispatch:
    inputs:
      picks:
        description: "Also remake the stock picks"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: America/New_York
      PICKS: ${{ github.event.schedule == '0 11 * * *' || github.event.schedule == '30 21 * * 1-5' || inputs.picks }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: ${{ env.PICKS == 'true' && 'pip' || '' }}   # news-only runs install nothing, so nothing to cache
      - name: Week number (SEC data is re-downloaded once a week)
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: env.PICKS == 'true'
        with:
          path: data/sec
          key: sec-${{ steps.week.outputs.week }}
      - name: Collect headlines
        run: python news.py
      - name: Remake stock picks
        if: env.PICKS == 'true'
        run: |
          pip install -q -r requirements.txt
          python forecast.py --refresh-prices
      - name: Build website
        run: python dashboard.py
      - name: Save results to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news/headlines.csv data/live/picks.csv data/live/versions.csv outputs/forecast.json
          git diff --cached --quiet || git commit -m "Update: $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase -q && git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: outputs/site

  publish:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
