# Keeps the website current on GitHub's servers:
#   every morning      - collect market headlines
#   weekday evenings   - also download fresh prices and remake the stock picks
# then rebuilds the site and publishes it to GitHub Pages.
name: Daily update

on:
  schedule:
    - cron: "0 11 * * *"      # 11:00 UTC: morning news
    - cron: "30 22 * * 1-5"   # 22:30 UTC, after the US market closes: news + picks
  workflow_dispatch:
    inputs:
      picks:
        description: "Also remake the stock picks"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: America/New_York
      PICKS: ${{ (github.event_name == 'workflow_dispatch' && inputs.picks) || github.event.schedule == '30 22 * * 1-5' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Week number (SEC data is re-downloaded once a week)
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: env.PICKS == 'true'
        with:
          path: data/sec
          key: sec-${{ steps.week.outputs.week }}
      - name: Collect headlines
        run: python news.py
      - name: Remake stock picks
        if: env.PICKS == 'true'
        run: |
          pip install -q -r requirements.txt
          python forecast.py --refresh-prices
      - name: Build website
        run: python dashboard.py
      - name: Save results to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news/headlines.csv outputs/forecast.json
          git diff --cached --quiet || git commit -m "Update: $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase -q && git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: outputs/site

  publish:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
